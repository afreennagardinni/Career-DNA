<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Career DNA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'accent': '#8B5CF6',
                        'accent-light': '#A78BFA',
                        'accent-dark': '#7C3AED',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in',
                        'slide-up': 'slideUp 0.5s ease-out',
                        'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
                        'float': 'float 3s ease-in-out infinite',
                        'gradient-shift': 'gradientShift 8s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 20px rgba(139, 92, 246, 0.5)' },
                            '50%': { boxShadow: '0 0 40px rgba(139, 92, 246, 0.8)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        gradientShift: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                        },
                    },
                },
            },
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0f0f23 100%);
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, 
                rgba(139, 92, 246, 0.1) 0%, 
                rgba(168, 85, 247, 0.05) 50%, 
                rgba(139, 92, 246, 0.1) 100%);
            background-size: 200% 200%;
            animation: gradientShift 8s ease-in-out infinite;
            z-index: -1;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .neon-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(139, 92, 246, 0.3);
            transition: all 0.3s ease;
        }
        
        .neon-input:focus {
            border-color: #8B5CF6;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.6);
            outline: none;
        }
        
        .neon-button {
            background: linear-gradient(45deg, #8B5CF6, #7C3AED);
            position: relative;
            overflow: hidden;
        }
        
        .neon-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .neon-button:hover::before {
            left: 100%;
        }
        
        .floating-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
        }
        
        .icon-glow {
            filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.8));
        }
    </style>
</head>
<body class="text-white font-sans">
    <!-- Floating Background Orbs -->
    <div class="floating-orb w-96 h-96 bg-purple-500" style="top: 10%; left: 10%;"></div>
    <div class="floating-orb w-64 h-64 bg-blue-500" style="top: 60%; right: 15%; animation-delay: 2s;"></div>
    <div class="floating-orb w-48 h-48 bg-indigo-500" style="top: 30%; left: 60%; animation-delay: 4s;"></div>

    <!-- Main Container -->
    <div class="min-h-screen flex items-center justify-center py-12 px-4 relative z-10">
        <div class="w-full max-w-md">
            <!-- Logo/Brand -->
            <div class="text-center mb-8 animate-fade-in">
                <h1 class="text-5xl font-bold mb-2">
                    <span class="bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">Career DNA</span>
                </h1>
                <p class="text-gray-400">Unlock your professional potential</p>
            </div>

            <!-- Login Card -->
            <div class="glass-card rounded-2xl p-8 animate-slide-up">
                <!-- Login Header -->
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-r from-purple-500 to-indigo-500 rounded-full mb-4">
                        <svg class="w-8 h-8 text-white icon-glow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 8zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                    <h2 class="text-2xl font-semibold">Welcome Back</h2>
                    <p class="text-gray-400 text-sm">Enter your credentials to access your account</p>
                </div>

                <!-- Login Form -->
                <form id="login-form" action="/auth/login" method="POST" class="space-y-6">
                    <!-- Email Field -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-300 mb-2">
                            <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 11-8 0 4 4 0 018 8zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                            Email Address
                        </label>
                        <div class="relative">
                            <input
                                type="email"
                                id="email"
                                name="email"
                                required
                                placeholder="your@email.com"
                                class="neon-input w-full px-4 py-3 rounded-lg text-white placeholder-gray-500 focus:outline-none"
                            >
                            <div class="absolute right-3 top-3.5 w-5 h-5 text-purple-400">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a22 22 0 0021.89 4.74L21 8M3 8l7.89-5.26a22 22 0 0021.89-4.74L21 8M3 8l7.89 5.26a22 22 0 0021.89 4.74L21 8"></path>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-300 mb-2">
                            <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 012 2v6a2 2 0 01-2 2H6a2 2 0 01-2-2v-6a2 2 0 012-2h12a2 2 0 012 2z"></path>
                            </svg>
                            Password
                        </label>
                        <div class="relative">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                required
                                placeholder="•••••••"
                                class="neon-input w-full px-4 py-3 pr-12 rounded-lg text-white placeholder-gray-500 focus:outline-none"
                            >
                            <div class="absolute right-3 top-3.5 w-5 h-5 text-purple-400 cursor-pointer" onclick="togglePassword()">
                                <svg id="eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 6zM2.458 12C3.732 7.943 4.5 7.943S1.268 12 2.458 12z"></path>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Remember Me -->
                    <div class="flex items-center justify-between">
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="remember" class="w-4 h-4 text-purple-500 bg-gray-800 border-gray-600 rounded focus:ring-purple-500">
                            <span class="ml-2 text-sm text-gray-300">Remember me</span>
                        </label>
                        <a href="#" class="text-sm text-purple-400 hover:text-purple-300 transition-colors">
                            Forgot password?
                        </a>
                    </div>

                    <!-- Error Message -->
                    {% if error %}
                    <div class="bg-red-500 bg-opacity-20 border border-red-500 rounded-lg p-3 text-red-400 text-sm animate-slide-up">
                        {{ error }}
                    </div>
                    {% endif %}
                    
                    <div id="error-message" class="hidden bg-red-500 bg-opacity-20 border border-red-500 rounded-lg p-3 text-red-400 text-sm animate-slide-up">
                        <!-- Error messages will appear here -->
                    </div>

                    <!-- Success Message -->
                    {% if success %}
                    <div class="bg-green-500 bg-opacity-20 border border-green-500 rounded-lg p-3 text-green-400 text-sm animate-slide-up">
                        {{ success }}
                    </div>
                    {% endif %}
                    
                    <div id="success-message" class="hidden bg-green-500 bg-opacity-20 border border-green-500 rounded-lg p-3 text-green-400 text-sm animate-slide-up">
                        <!-- Success messages will appear here -->
                    </div>

                    <!-- Submit Button -->
                    <button
                        type="submit"
                        class="neon-button w-full py-3 px-4 rounded-lg text-white font-semibold hover:scale-105 transition-all duration-300 relative overflow-hidden"
                    >
                        <span class="relative z-10">Sign In</span>
                    </button>
                </form>

                <!-- Register Link -->
                <div class="text-center mt-6 pt-6 border-t border-gray-700">
                    <p class="text-gray-400 text-sm">
                        Don't have an account?
                        <a href="/register" class="text-purple-400 hover:text-purple-300 font-semibold transition-colors">
                            Create Account
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0012 19c4.9 0 9.09-3.642 9.09-8.108 0-3.51a1.5 1.5 0 01.293-1.293L6.58 18.707a1.5 1.5 0 01-1.293 1.293z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 6z"></path>';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 4.5 7.943S1.268 12 2.458 12z"></path>';
            }
        }

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {
                email: formData.get('email'),
                password: formData.get('password'),
                remember_me: document.getElementById('remember').checked
            };
            
            // Hide previous messages
            hideMessages();
            
            // Show loading state
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="relative z-10">Signing in...</span>';
            submitBtn.disabled = true;
            
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showSuccess('Login successful! Redirecting to dashboard...');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showError(result.message || 'Login failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('An error occurred. Please try again.');
            } finally {
                // Restore button state
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            document.getElementById('success-message').classList.add('hidden');
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.classList.remove('hidden');
            document.getElementById('error-message').classList.add('hidden');
        }

        function hideMessages() {
            document.getElementById('error-message').classList.add('hidden');
            document.getElementById('success-message').classList.add('hidden');
        }
    </script>
</body>
</html>
