{% extends "base.html" %}
{% block title %}Login - Career DNA{% endblock %}

{% set hide_nav = True %}
{% set hide_footer = True %}

{% block content %}
<div class="auth-page">
    <div class="neuro-card animate-fade-in">
        <!-- Logo -->
        <span class="neuro-logo">Career DNA</span>

        <!-- Login Form -->
        <form id="login-form" class="space-y-1">
            <input
                type="text"
                name="email"
                id="email"
                required
                class="neuro-input"
                placeholder="Phone, email address or username"
            >
            <input
                type="password"
                name="password"
                id="password"
                required
                class="neuro-input"
                placeholder="Password"
            >

            <!-- Error Message -->
            <div id="error-message" class="hidden text-red-500 text-[11px] mb-2 text-center"></div>

            <div class="pt-2">
                <button type="submit" class="neuro-btn">
                    Log in
                </button>
            </div>
        </form>

        <!-- Forgot Password -->
        <div class="mt-4">
            <a href="/forgot-password" class="neuro-link">
                Forgotten your login details? <span class="neuro-link-bold">Get help with signing in.</span>
            </a>
        </div>

        <!-- Register Link -->
        <div class="mt-8 pt-4 border-t border-gray-200/50">
            <p class="neuro-link">
                Don't have an account? 
                <a href="/register" class="neuro-link-bold">SignUp</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const data = {
        email: formData.get('email'),
        password: formData.get('password')
    };
    
    // Hide previous messages
    const errorDiv = document.getElementById('error-message');
    errorDiv.classList.add('hidden');
    
    // Disable button
    const btn = this.querySelector('button');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Logging in...';
    
    try {
        const response = await fetch('/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (response.ok) {
            window.location.href = '/dashboard';
        } else {
            errorDiv.textContent = result.message || 'Login failed';
            errorDiv.classList.remove('hidden');
        }
    } catch (error) {
        errorDiv.textContent = 'An error occurred. Please try again.';
        errorDiv.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.textContent = originalText;
    }
});
</script>
{% endblock %}
