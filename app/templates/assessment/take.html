{% extends "base.html" %}

{% block title %}Take Assessment - Career DNA{% endblock %}

{% block content %}
<div class="min-h-screen py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden" id="assessment-app">
    <!-- Background Effects -->
    <div class="absolute top-0 left-0 w-full h-96 bg-accent/10 rounded-full mix-blend-screen filter blur-[100px] opacity-50"></div>

    <div class="max-w-3xl mx-auto relative z-10" id="loading-view">
        <div class="glass-card rounded-2xl p-8 text-center animate-pulse">
            <i class="fas fa-circle-notch fa-spin text-4xl text-accent mb-4"></i>
            <h2 class="text-2xl font-bold text-white">Loading Assessment...</h2>
        </div>
    </div>

    <div class="max-w-3xl mx-auto relative z-10 hidden" id="assessment-view">
        <!-- Progress -->
        <div class="mb-8">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium text-gray-300">Question <span id="current-q-num">1</span> of <span id="total-q-num">20</span></span>
                <span class="text-sm font-medium text-accent" id="progress-percent">0%</span>
            </div>
            <div class="w-full bg-gray-700 rounded-full h-2">
                <div class="bg-accent h-2 rounded-full transition-all duration-500" id="progress-bar" style="width: 0%"></div>
            </div>
        </div>

        <!-- Question Card -->
        <div class="glass-card rounded-2xl p-8 mb-8 transform transition-all duration-300" id="question-card">
            <h2 class="text-3xl font-bold text-white mb-8" id="question-text">Question Text</h2>
            
            <div id="options-container" class="space-y-4">
                <!-- Options injected here -->
            </div>
        </div>
        
        <div class="flex justify-between">
            <button id="btn-prev" class="px-6 py-3 rounded-lg border border-gray-600 text-gray-300 hover:bg-white/10 transition-colors hidden">
                <i class="fas fa-arrow-left mr-2"></i> Previous
            </button>
            <div class="flex-grow"></div>
            <button id="btn-next" class="px-6 py-3 rounded-lg bg-accent text-white hover:bg-accent-dark transition-colors opacity-50 cursor-not-allowed" disabled>
                Next <i class="fas fa-arrow-right ml-2"></i>
            </button>
            <button id="btn-submit" class="px-6 py-3 rounded-lg bg-green-500 text-white hover:bg-green-600 transition-colors hidden">
                Submit Assessment <i class="fas fa-check ml-2"></i>
            </button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    let questions = [];
    let currentIdx = 0;
    const answers = {};

    // Elements
    const viewLoading = document.getElementById('loading-view');
    const viewAssessment = document.getElementById('assessment-view');
    const qText = document.getElementById('question-text');
    const optContainer = document.getElementById('options-container');
    const btnNext = document.getElementById('btn-next');
    const btnPrev = document.getElementById('btn-prev');
    const btnSubmit = document.getElementById('btn-submit');
    const currNum = document.getElementById('current-q-num');
    const totNum = document.getElementById('total-q-num');
    const progBar = document.getElementById('progress-bar');
    const progPct = document.getElementById('progress-percent');

    // Fetch Questions
    try {
        const res = await fetch('/assessment/api/questions');
        const data = await res.json();
        questions = data.questions;
        totNum.textContent = questions.length;
        
        viewLoading.classList.add('hidden');
        viewAssessment.classList.remove('hidden');
        renderQuestion();
    } catch (err) {
        showToast('Failed to load questions.', 'error');
    }

    function renderQuestion() {
        const q = questions[currentIdx];
        qText.textContent = q.text;
        currNum.textContent = currentIdx + 1;
        
        const pct = Math.round((currentIdx / questions.length) * 100);
        progBar.style.width = pct + '%';
        progPct.textContent = pct + '%';
        
        optContainer.innerHTML = '';
        
        const currentAnswer = answers[q.id];

        if (q.type === 'card_select') {
            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-1 md:grid-cols-2 gap-4';
            
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `p-6 rounded-xl border text-left transition-all duration-200 group flex items-center space-x-4
                    ${currentAnswer === opt.id ? 'border-accent bg-accent/20 shadow-[0_0_15px_rgba(139,92,246,0.3)]' : 'border-gray-600 hover:border-accent hover:bg-white/5'}`;
                
                btn.innerHTML = `
                    <div class="text-4xl group-hover:scale-110 transition-transform">${opt.emoji || ''}</div>
                    <div class="text-lg font-medium text-white">${opt.text}</div>
                `;
                
                btn.onclick = () => {
                    answers[q.id] = opt.id;
                    enableNext();
                    renderQuestion(); // Re-render to show selection
                };
                grid.appendChild(btn);
            });
            optContainer.appendChild(grid);
        } else if (q.type === 'scale_5') {
            const flex = document.createElement('div');
            flex.className = 'flex flex-col items-center space-y-6 mt-8';
            
            const scaleDiv = document.createElement('div');
            scaleDiv.className = 'flex justify-between items-center w-full max-w-lg space-x-2';
            
            for(let i=1; i<=5; i++) {
                const btn = document.createElement('button');
                btn.className = `w-14 h-14 rounded-full flex items-center justify-center text-xl font-bold transition-all duration-200
                    ${currentAnswer == i ? 'bg-accent text-white scale-110 shadow-[0_0_20px_rgba(139,92,246,0.5)]' : 'bg-gray-800 text-gray-400 hover:bg-gray-700 border border-gray-600'}`;
                btn.textContent = i;
                btn.onclick = () => {
                    answers[q.id] = i;
                    enableNext();
                    renderQuestion();
                };
                scaleDiv.appendChild(btn);
            }
            
            const labelsDiv = document.createElement('div');
            labelsDiv.className = 'flex justify-between w-full max-w-lg text-sm text-gray-400 px-2';
            labelsDiv.innerHTML = `<span>Strongly Disagree</span><span>Neutral</span><span>Strongly Agree</span>`;
            
            flex.appendChild(scaleDiv);
            flex.appendChild(labelsDiv);
            optContainer.appendChild(flex);
        }
        
        // Buttons
        btnPrev.classList.toggle('hidden', currentIdx === 0);
        
        if (currentIdx === questions.length - 1) {
            btnNext.classList.add('hidden');
            btnSubmit.classList.remove('hidden');
            if (answers[q.id]) {
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                btnSubmit.disabled = true;
                btnSubmit.classList.add('opacity-50', 'cursor-not-allowed');
            }
        } else {
            btnSubmit.classList.add('hidden');
            btnNext.classList.remove('hidden');
            if (answers[q.id]) enableNext();
            else disableNext();
        }
    }

    function enableNext() {
        btnNext.disabled = false;
        btnNext.classList.remove('opacity-50', 'cursor-not-allowed');
    }
    
    function disableNext() {
        btnNext.disabled = true;
        btnNext.classList.add('opacity-50', 'cursor-not-allowed');
    }

    btnNext.onclick = () => {
        if (currentIdx < questions.length - 1) {
            currentIdx++;
            renderQuestion();
        }
    };

    btnPrev.onclick = () => {
        if (currentIdx > 0) {
            currentIdx--;
            renderQuestion();
        }
    };

    btnSubmit.onclick = async () => {
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Analyzing...';
        showToast('Assessment submitted! Analyzing your Career DNA...', 'info');
        
        try {
            const res = await fetch('/assessment/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answers })
            });
            const data = await res.json();
            
            if (data.success) {
                showToast('Analysis complete! Redirecting...', 'success');
                setTimeout(() => window.location.href = data.redirect, 1500);
            } else {
                showToast(data.error || 'Failed to submit', 'error');
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = 'Submit Assessment <i class="fas fa-check ml-2"></i>';
            }
        } catch (err) {
            showToast('Network error occurred.', 'error');
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = 'Submit Assessment <i class="fas fa-check ml-2"></i>';
        }
    };
});
</script>
{% endblock %}
