{% extends "base.html" %}

{% block title %}Assessment Limit Reached - Career DNA{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    <!-- Background Effects -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-accent/20 rounded-full mix-blend-screen filter blur-3xl opacity-50 animate-pulse-glow"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-500/20 rounded-full mix-blend-screen filter blur-3xl opacity-50 animate-float"></div>

    <div class="max-w-md w-full space-y-8 glass-card p-10 rounded-2xl relative z-10 text-center">
        <div>
            <div class="mx-auto h-20 w-20 bg-red-500/20 rounded-full flex items-center justify-center mb-6">
                <i class="fas fa-lock text-4xl text-red-400"></i>
            </div>
            <h2 class="text-3xl font-bold text-white glow-text mb-4">Assessment Limit Reached</h2>
            <p class="text-gray-300 mb-8">
                You've taken {{ count }} assessments, which is the maximum allowed. Want to retake? Contact support.
            </p>
        </div>
        
        <div class="space-y-4">
            <a href="/assessment/results/compare" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-accent hover:bg-accent-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent transition-colors">
                <i class="fas fa-chart-bar mr-2 mt-1"></i> Compare Your Results
            </a>
            <a href="/dashboard" class="w-full flex justify-center py-3 px-4 border border-gray-500 rounded-lg shadow-sm text-sm font-medium text-white bg-transparent hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-colors">
                Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
