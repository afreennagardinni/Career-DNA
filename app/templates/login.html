{% extends "base.html" %}

{% block title %}Login - Career DNA{% endblock %}

{% set hide_nav = True %}
{% set hide_footer = True %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-[420px] w-full animate-slide-up">
        <div class="neuro-card overflow-hidden !p-0">
            <!-- Teal Header Panel -->
            <div class="auth-header-panel">
                <p class="text-white/80 text-sm font-medium uppercase tracking-wider mb-1">Welcome</p>
                <h1 class="text-white text-3xl font-bold">Sign In</h1>
            </div>

            <!-- Form Content -->
            <div class="p-10 space-y-6">
                <form id="login-form" class="space-y-5">
                    <div class="space-y-1.5">
                        <label class="text-text-muted text-[11px] uppercase font-bold tracking-widest ml-1">Email Address</label>
                        <input
                            type="email"
                            name="email"
                            required
                            class="neuro-input"
                            placeholder="your@email.com"
                        >
                    </div>

                    <div class="space-y-1.5">
                        <div class="flex justify-between items-center px-1">
                            <label class="text-text-muted text-[11px] uppercase font-bold tracking-widest">Password</label>
                            <a href="/forgot-password" class="text-accent-light text-[11px] font-bold hover:underline">Forget Password?</a>
                        </div>
                        <input
                            type="password"
                            name="password"
                            required
                            class="neuro-input"
                            placeholder="••••••••"
                        >
                    </div>

                    <div id="error-message" class="hidden text-red-400 text-xs bg-red-400/10 p-3 rounded-lg border border-red-400/20 text-center"></div>

                    <button type="submit" class="btn-accent w-full py-3.5 mt-4">
                        Sign In
                    </button>
                </form>

                <div class="relative py-4">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-border"></div></div>
                    <div class="relative flex justify-center text-xs uppercase"><span class="bg-bg-card px-3 text-text-muted">or</span></div>
                </div>

                <p class="text-center text-sm text-text-secondary">
                    Don't have an account? 
                    <a href="/register" class="text-accent-light font-bold hover:underline">Sign Up</a>
                </p>
            </div>
        </div>
        
        <div class="mt-8 text-center">
            <a href="/" class="logo-text text-xl">Career DNA</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const errorDiv = document.getElementById('error-message');
    errorDiv.classList.add('hidden');
    
    const formData = new FormData(this);
    const data = {
        email: formData.get('email'),
        password: formData.get('password')
    };
    
    const btn = this.querySelector('button');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Authenticating...';
    
    try {
        const response = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await response.json();
        if (response.ok) {
            window.location.href = '/dashboard';
        } else {
            errorDiv.textContent = result.message || 'Login failed';
            errorDiv.classList.remove('hidden');
        }
    } catch (error) {
        errorDiv.textContent = 'An error occurred. Please try again.';
        errorDiv.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.textContent = originalText;
    }
});
</script>
{% endblock %}
