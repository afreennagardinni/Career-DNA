{% extends "base.html" %}

{% block title %}Register - Career DNA{% endblock %}

{% set hide_nav = True %}
{% set hide_footer = True %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-[420px] w-full animate-slide-up">
        <div class="neuro-card overflow-hidden !p-0">
            <!-- Teal Header Panel -->
            <div class="auth-header-panel">
                <p class="text-white/80 text-sm font-medium uppercase tracking-wider mb-1">Join Us</p>
                <h1 class="text-white text-3xl font-bold">Sign Up</h1>
            </div>

            <!-- Form Content -->
            <div class="p-10 space-y-6">
                <form id="register-form" class="space-y-4">
                    <div class="space-y-1">
                        <label class="text-text-muted text-[10px] uppercase font-bold tracking-widest ml-1">Email Address</label>
                        <input type="email" name="email" required class="neuro-input" placeholder="your@email.com">
                    </div>

                    <div class="space-y-1">
                        <label class="text-text-muted text-[10px] uppercase font-bold tracking-widest ml-1">Full Name</label>
                        <input type="text" name="first-name" required class="neuro-input" placeholder="John Doe">
                    </div>

                    <div class="space-y-1">
                        <label class="text-text-muted text-[10px] uppercase font-bold tracking-widest ml-1">Username</label>
                        <input type="text" name="last-name" required class="neuro-input" placeholder="johndoe123">
                    </div>

                    <div class="space-y-1">
                        <label class="text-text-muted text-[10px] uppercase font-bold tracking-widest ml-1">Password</label>
                        <input type="password" name="password" required class="neuro-input" placeholder="••••••••">
                    </div>

                    <div id="error-message" class="hidden text-red-400 text-xs bg-red-400/10 p-3 rounded-lg border border-red-400/20 text-center"></div>

                    <button type="submit" class="btn-accent w-full py-3.5 mt-4">
                        Sign Up
                    </button>
                </form>

                <div class="relative py-4">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-border"></div></div>
                    <div class="relative flex justify-center text-xs uppercase"><span class="bg-bg-card px-3 text-text-muted">or</span></div>
                </div>

                <p class="text-center text-sm text-text-secondary">
                    Already have an account? 
                    <a href="/login" class="text-accent-light font-bold hover:underline">Log In</a>
                </p>
            </div>
        </div>

        <div class="mt-8 text-center">
            <a href="/" class="logo-text text-xl">Career DNA</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('register-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const errorDiv = document.getElementById('error-message');
    errorDiv.classList.add('hidden');
    
    const formData = new FormData(this);
    const data = {
        email: formData.get('email'),
        password: formData.get('password'),
        confirm_password: formData.get('password'), // Using same as password for simplicity in this UI
        first_name: formData.get('first-name'),
        last_name: formData.get('last-name')
    };
    
    const btn = this.querySelector('button');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Creating Account...';
    
    try {
        const response = await fetch('/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await response.json();
        if (response.ok) {
            window.location.href = '/login';
        } else {
            errorDiv.textContent = result.message || 'Registration failed';
            errorDiv.classList.remove('hidden');
        }
    } catch (error) {
        errorDiv.textContent = 'An error occurred. Please try again.';
        errorDiv.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.textContent = originalText;
    }
});
</script>
{% endblock %}
