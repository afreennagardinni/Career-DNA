<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career DNA - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(120deg); }
            66% { transform: translateY(10px) rotate(240deg); }
        }
        
        @keyframes glow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
        
        .floating-blob {
            animation: float 20s infinite ease-in-out;
            filter: blur(40px);
        }
        
        .glow-blob {
            animation: glow 4s infinite ease-in-out;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .neon-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .neon-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .neon-button:hover::before {
            left: 100%;
        }
        
        .neon-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4), 0 0 20px rgba(102, 126, 234, 0.2);
        }
        
        .floating-label {
            transition: all 0.2s ease;
        }
        
        .input-group:focus-within .floating-label,
        .input-group input:not(:placeholder-shown) ~ .floating-label,
        .input-group.has-value .floating-label {
            transform: translateY(-25px) scale(0.85);
            color: #667eea;
        }
        
        .input-icon {
            transition: color 0.2s ease;
        }
        
        .input-group:focus-within .input-icon {
            color: #667eea;
        }
        
        .error-shake {
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .loading-spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-blue-900 overflow-hidden relative">
    
    <!-- Animated Background Blobs -->
    <div class="absolute inset-0 overflow-hidden">
        <div class="floating-blob glow-blob absolute top-20 left-20 w-72 h-72 bg-purple-500 rounded-full opacity-30"></div>
        <div class="floating-blob glow-blob absolute top-40 right-20 w-96 h-96 bg-blue-500 rounded-full opacity-30" style="animation-delay: -5s;"></div>
        <div class="floating-blob glow-blob absolute bottom-20 left-1/2 w-80 h-80 bg-indigo-500 rounded-full opacity-30" style="animation-delay: -10s;"></div>
        <div class="floating-blob glow-blob absolute bottom-40 right-40 w-64 h-64 bg-pink-500 rounded-full opacity-30" style="animation-delay: -15s;"></div>
    </div>
    
    <!-- Main Content -->
    <div class="relative z-10 min-h-screen flex items-center justify-center px-4 py-12">
        <div class="glass-card rounded-3xl p-8 md:p-12 w-full max-w-5xl shadow-2xl">
            
            <!-- Header -->
            <div class="text-center mb-10">
                <h1 class="text-5xl md:text-6xl font-bold gradient-text mb-3">Career DNA</h1>
                <p class="text-gray-300 text-lg md:text-xl">Discover your future with AI</p>
            </div>
            
            <!-- Form -->
            <form id="registerForm" class="space-y-6">
                <!-- Name Fields -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="input-group relative">
                        <div class="relative">
                            <i class="fas fa-user input-icon absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="firstName" name="firstName" 
                                   class="w-full pl-12 pr-4 py-4 bg-white/10 border border-white/20 rounded-xl text-white placeholder-transparent focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/20 transition-all"
                                   placeholder="First Name">
                            <label for="firstName" class="floating-label absolute left-12 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none">
                                First Name
                            </label>
                        </div>
                        <span class="error-message text-red-400 text-sm mt-1 hidden">Please enter your first name</span>
                    </div>
                    
                    <div class="input-group relative">
                        <div class="relative">
                            <i class="fas fa-user input-icon absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="lastName" name="lastName" 
                                   class="w-full pl-12 pr-4 py-4 bg-white/10 border border-white/20 rounded-xl text-white placeholder-transparent focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/20 transition-all"
                                   placeholder="Last Name">
                            <label for="lastName" class="floating-label absolute left-12 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none">
                                Last Name
                            </label>
                        </div>
                        <span class="error-message text-red-400 text-sm mt-1 hidden">Please enter your last name</span>
                    </div>
                </div>
                
                <!-- Email Field -->
                <div class="input-group relative">
                    <div class="relative">
                        <i class="fas fa-envelope input-icon absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="email" id="email" name="email" 
                               class="w-full pl-12 pr-4 py-4 bg-white/10 border border-white/20 rounded-xl text-white placeholder-transparent focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/20 transition-all"
                               placeholder="Email">
                        <label for="email" class="floating-label absolute left-12 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none">
                            Email Address
                        </label>
                    </div>
                    <span class="error-message text-red-400 text-sm mt-1 hidden">Please enter a valid email</span>
                </div>
                
                <!-- Password Field -->
                <div class="input-group relative">
                    <div class="relative">
                        <i class="fas fa-lock input-icon absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="password" id="password" name="password" 
                               class="w-full pl-12 pr-12 py-4 bg-white/10 border border-white/20 rounded-xl text-white placeholder-transparent focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/20 transition-all"
                               placeholder="Password">
                        <label for="password" class="floating-label absolute left-12 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none">
                            Password
                        </label>
                        <button type="button" id="togglePassword" 
                                class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white transition-colors">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message text-red-400 text-sm mt-1 hidden">Password must be at least 8 characters</span>
                </div>
                
                <!-- Confirm Password Field -->
                <div class="input-group relative">
                    <div class="relative">
                        <i class="fas fa-lock input-icon absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" 
                               class="w-full pl-12 pr-12 py-4 bg-white/10 border border-white/20 rounded-xl text-white placeholder-transparent focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/20 transition-all"
                               placeholder="Confirm Password">
                        <label for="confirmPassword" class="floating-label absolute left-12 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none">
                            Confirm Password
                        </label>
                        <button type="button" id="toggleConfirmPassword" 
                                class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white transition-colors">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message text-red-400 text-sm mt-1 hidden">Passwords do not match</span>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" id="submitBtn" 
                        class="neon-button w-full py-4 rounded-xl text-white font-semibold text-lg shadow-lg transform transition-all duration-300 hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-purple-400/50">
                    <span id="buttonText" class="flex items-center justify-center">
                        <i class="fas fa-rocket mr-2"></i>
                        Create Account
                    </span>
                    <div id="buttonLoader" class="loading-spinner mx-auto hidden"></div>
                </button>
                
                <!-- Error Message -->
                <div id="errorMessage" class="hidden bg-red-500/20 border border-red-500/50 rounded-lg p-4 text-red-300 text-center transition-all duration-300">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span id="errorText"></span>
                </div>
            </form>
            
            <!-- Footer Link -->
            <div class="text-center mt-8">
                <p class="text-gray-400">
                    Already have an account? 
                    <a href="#" class="text-purple-400 hover:text-purple-300 transition-colors font-semibold">
                        Sign In
                    </a>
                </p>
            </div>
        </div>
    </div>
    
    <script>
        // Password visibility toggle
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
        
        document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const icon = this.querySelector('i');
            
            if (confirmPasswordInput.type === 'password') {
                confirmPasswordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                confirmPasswordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
        
        // Form validation and submission
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Clear previous errors
            document.querySelectorAll('.error-message').forEach(msg => msg.classList.add('hidden'));
            document.querySelectorAll('.input-group').forEach(group => group.classList.remove('error-shake'));
            document.getElementById('errorMessage').classList.add('hidden');
            
            // Get form values
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            let hasError = false;
            
            // Validate first name
            if (!firstName) {
                const firstNameGroup = document.getElementById('firstName').closest('.input-group');
                firstNameGroup.querySelector('.error-message').classList.remove('hidden');
                firstNameGroup.classList.add('error-shake');
                hasError = true;
            }
            
            // Validate last name
            if (!lastName) {
                const lastNameGroup = document.getElementById('lastName').closest('.input-group');
                lastNameGroup.querySelector('.error-message').classList.remove('hidden');
                lastNameGroup.classList.add('error-shake');
                hasError = true;
            }
            
            // Validate email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailRegex.test(email)) {
                const emailGroup = document.getElementById('email').closest('.input-group');
                emailGroup.querySelector('.error-message').classList.remove('hidden');
                emailGroup.classList.add('error-shake');
                hasError = true;
            }
            
            // Validate password
            if (!password || password.length < 8) {
                const passwordGroup = document.getElementById('password').closest('.input-group');
                passwordGroup.querySelector('.error-message').classList.remove('hidden');
                passwordGroup.classList.add('error-shake');
                hasError = true;
            }
            
            // Validate password confirmation
            if (password !== confirmPassword) {
                const confirmPasswordGroup = document.getElementById('confirmPassword').closest('.input-group');
                confirmPasswordGroup.querySelector('.error-message').classList.remove('hidden');
                confirmPasswordGroup.classList.add('error-shake');
                hasError = true;
            }
            
            if (hasError) return;
            
            // Show loading state
            const submitBtn = document.getElementById('submitBtn');
            const buttonText = document.getElementById('buttonText');
            const buttonLoader = document.getElementById('buttonLoader');
            
            submitBtn.disabled = true;
            buttonText.classList.add('hidden');
            buttonLoader.classList.remove('hidden');
            
            // Simulate API call
            try {
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                // For Flask integration, you would submit the form here
                // this.submit();
                
                // Show success (in real app, this would redirect)
                document.getElementById('errorText').textContent = 'Account created successfully! Redirecting...';
                document.getElementById('errorMessage').classList.remove('hidden');
                document.getElementById('errorMessage').classList.remove('bg-red-500/20', 'border-red-500/50', 'text-red-300');
                document.getElementById('errorMessage').classList.add('bg-green-500/20', 'border-green-500/50', 'text-green-300');
                
                setTimeout(() => {
                    // Redirect to login or dashboard
                    window.location.href = '/login';
                }, 2000);
                
            } catch (error) {
                // Show error
                document.getElementById('errorText').textContent = 'Registration failed. Please try again.';
                document.getElementById('errorMessage').classList.remove('hidden');
                
                // Reset button state
                submitBtn.disabled = false;
                buttonText.classList.remove('hidden');
                buttonLoader.classList.add('hidden');
            }
        });
        
        // Add input event listeners for floating labels
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', function() {
                if (this.value) {
                    this.closest('.input-group').classList.add('has-value');
                } else {
                    this.closest('.input-group').classList.remove('has-value');
                }
            });
        });
    </script>
</body>
</html>
